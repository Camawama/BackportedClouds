modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
# Purely client-side: Forge skips loading on dedicated servers and sets the correct
# display test so joining servers without the mod does not show a version mismatch.
clientSideOnly=true

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
description='''${mod_description}'''
# Explicit for Forge builds that predate clientSideOnly support.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
